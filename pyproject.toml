[build-system]
requires = ["setuptools>=61", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "binmod1d"         # must be unique on PyPI
version = "1.0.10"
description = "A 1D Column bin microphysics model that performs collision-coalescence and breakup."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Edwin Lee Dunnavan, RSII Cooperative Institute for Severe and High-Impact Research and Weather Operations (CIWRO)", email="edwin.dunnavan@noaa.gov"}]
license = { file = "LICENSE" }

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
		"numpy>=2.0.0",
		"mpmath>=1.3.0",
		"scipy>=1.15.0",
		"numba>=0.61.0",
		"matplotlib>=3.9.0",
		"netcdf4>=1.7.0",
		"tqdm>=4.66.0",
		"cloudpickle>=3.0.0",
		]

# optional:
[project.urls]
"Homepage" = "https://github.com/NOAA-National-Severe-Storms-Laboratory/BinMod1D"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
docs = [
    "myst-parser",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinx-rtd-theme",
    "nbsphinx",
    "ipython",
]

test = [
    "pytest",
]

#[tool.setuptools]
# This explicitly sets the content type, although 'readme = "README.md"' often implies it for markdown
#long-description-content-type = "text/markdown" # <--- Crucial for rendering Markdown correctly


[tool.pylint.messages_control]
disable = [
    "invalid-name",                 # Allow math/physics variable names (ZH, Mbins, Ecol)
    "line-too-long",                # Allow long equations without forced line breaks
    "too-many-arguments",           # Allow complex scientific methods to take many parameters
    "too-many-instance-attributes", # Allow the spectral_1d class to hold its many physics arrays
    "too-many-locals",              # Allow RK solvers to use necessary local variables
    "redefined-outer-name",         # Prevent warnings common in notebook-to-script code
    "missing-docstring",            # Suppress warnings if minor helper functions lack docstrings
    "ungrouped-imports",            # Prevent pedantic warnings about import ordering
]